
[build]
  command = "npm run build"
  publish = "dist"
</build>

This tells Netlify to publish Vite's generated `dist` folder.

## Step 3: Check your build locally

Open the terminal inside `PawRescue-fixed` and run:

```bash
npm run build
```

After it succeeds, check whether this file exists:

```text
PawRescue-fixed/dist/index.html
```

Also check that `dist/assets` contains your generated JavaScript and CSS files.

